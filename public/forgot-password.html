<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | Junaid Dental Care</title>
  <meta name="description" content="Reset your Junaid Dental Care password.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card card" style="padding:2.5rem">
      <a class="logo" href="/" style="margin-bottom:1.75rem;display:flex">
        <span class="logo-icon" id="fpLogoIcon"></span>
        <span class="logo-text"><span class="brand">Serene <span>Dental</span></span><span class="tag">Reset Password</span></span>
      </a>
      <h1 class="section-title" style="margin-bottom:.25rem">Reset your password</h1>
      <p class="text-muted text-sm" style="margin-bottom:1.75rem">Enter your email and we'll send you a reset link.</p>
      <form id="forgotForm">
        <div class="form-group"><label class="form-label">Email address</label><input type="email" name="email" class="form-input" required></div>
        <button class="btn btn-primary btn-lg btn-block" type="submit" id="fpBtn">Send Reset Link</button>
      </form>
      <p class="text-center text-sm text-muted" style="margin-top:1.5rem"><a href="/login" style="color:var(--primary);font-weight:600">← Back to login</a></p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
  <script>document.getElementById("fpLogoIcon").innerHTML = SD.toothSVG();</script>
</body>
</html>
