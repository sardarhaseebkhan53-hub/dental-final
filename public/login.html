<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Serene Dental</title>
  <meta name="description" content="Log in to your Serene Dental account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card card" style="padding:2.5rem">
      <a class="logo" href="/" style="margin-bottom:1.75rem;display:flex">
        <span class="logo-icon" id="loginLogoIcon"></span>
        <span class="logo-text"><span class="brand">Serene <span>Dental</span></span><span class="tag">Patient Portal</span></span>
      </a>
      <h1 class="section-title" style="margin-bottom:.25rem">Welcome back</h1>
      <p class="text-muted text-sm" style="margin-bottom:1.75rem">Log in to manage your appointments and account.</p>
      <form id="loginForm">
        <div class="form-group"><label class="form-label">Email address</label><input type="email" name="email" class="form-input" required></div>
        <div class="form-group"><label class="form-label">Password</label><input type="password" name="password" class="form-input" required></div>
        <div class="flex justify-between items-center" style="margin-bottom:1.5rem">
          <a class="text-sm" style="color:var(--primary)" href="/forgot-password">Forgot password?</a>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit" id="loginBtn">Log In</button>
      </form>
      <p class="text-center text-sm text-muted" style="margin-top:1.5rem">Don't have an account? <a href="/register" style="color:var(--primary);font-weight:600">Create one</a></p>
      <p class="text-center text-sm text-muted" style="margin-top:.75rem"><a href="/" style="color:var(--primary)">← Back to home</a></p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
  <script>document.getElementById("loginLogoIcon").innerHTML = SD.toothSVG();</script>
</body>
</html>
