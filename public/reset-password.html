<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set New Password | Serene Dental</title>
  <meta name="description" content="Set a new password for your Serene Dental account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card card" style="padding:2.5rem">
      <a class="logo" href="/" style="margin-bottom:1.75rem;display:flex">
        <span class="logo-icon" id="rpLogoIcon"></span>
        <span class="logo-text"><span class="brand">Serene <span>Dental</span></span><span class="tag">Reset Password</span></span>
      </a>
      <h1 class="section-title" style="margin-bottom:.25rem">Set a new password</h1>
      <p class="text-muted text-sm" style="margin-bottom:1.75rem">Enter your new password below.</p>
      <form id="resetForm">
        <div class="form-group"><label class="form-label">New password</label>
          <input type="password" name="password" class="form-input" required>
          <div class="form-hint">At least 8 characters with an uppercase letter and a number.</div>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit" id="rpBtn">Reset Password</button>
      </form>
      <p class="text-center text-sm text-muted" style="margin-top:1.5rem"><a href="/login" style="color:var(--primary);font-weight:600">← Back to login</a></p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
  <script>document.getElementById("rpLogoIcon").innerHTML = SD.toothSVG();</script>
</body>
</html>
